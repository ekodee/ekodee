<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Muhamad Safii — Junior Web Developer, Information Systems graduate" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/>
      <stop offset="1" stop-color="#10213a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="reveal">
      <rect x="48" y="84" height="80" width="0">
        <animate attributeName="width" from="0" to="820" dur="1.4s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.2 1" keyTimes="0;1"/>
      </rect>
    </clipPath>
  </defs>

  <!-- card -->
  <rect width="900" height="260" rx="16" fill="url(#bg)"/>
  <rect width="900" height="260" rx="16" fill="url(#grid)"/>
  <rect width="900" height="260" rx="16" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="899" height="259" rx="16" fill="none" stroke="#5eead4" stroke-opacity="0.28"/>

  <!-- release chip -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
    <rect x="48" y="36" width="206" height="28" rx="14" fill="#5eead4" fill-opacity="0.1" stroke="#5eead4" stroke-opacity="0.5"/>
    <text x="64" y="55" fill="#5eead4">v1.0.0 · fresh-graduate</text>
  </g>

  <!-- open to work chip -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
    <rect x="690" y="36" width="162" height="28" rx="14" fill="#fbbf24" fill-opacity="0.1" stroke="#fbbf24" stroke-opacity="0.5"/>
    <circle cx="710" cy="50" r="4" fill="#fbbf24">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="r" values="4;5.5;4" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="724" y="55" fill="#fbbf24">open to work</text>
  </g>

  <!-- name (typed reveal) -->
  <g clip-path="url(#reveal)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="48" y="140" font-size="58" font-weight="700" fill="url(#accent)">Muhamad Safii</text>
  </g>

  <!-- role -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="48" y="178" font-size="22" fill="#e6edf3" opacity="0">Junior Web Developer
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.2s" fill="freeze"/>
    </text>
    <text x="48" y="208" font-size="14" fill="#8b98a9" opacity="0">Laravel  ·  React  ·  REST API  ·  RAG  ·  Information Systems '26
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.5s" fill="freeze"/>
    </text>
  </g>

  <!-- scan line -->
  <rect x="48" y="228" width="804" height="2" rx="1" fill="#ffffff" fill-opacity="0.08"/>
  <rect x="48" y="228" width="120" height="2" rx="1" fill="url(#accent)">
    <animate attributeName="x" values="48;732;48" dur="5s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" keyTimes="0;0.5;1"/>
  </rect>
</svg>
