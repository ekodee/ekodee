<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290" role="img" aria-label="The Safii Gazette — Developer ships, learns, ships again. Muhamad Safii, web developer." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.28  0 0 0 0 0.15  0 0 0 0.09 0"/>
    </filter>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.6" stop-color="#8a6d3b" stop-opacity="0"/>
      <stop offset="1" stop-color="#8a6d3b" stop-opacity="0.22"/>
    </radialGradient>
  </defs>

  <!-- paper -->
  <rect width="900" height="290" rx="6" fill="#f3ecd9"/>
  <rect width="900" height="290" rx="6" filter="url(#paper)"/>
  <rect width="900" height="290" rx="6" fill="url(#vignette)"/>
  <rect x="0.75" y="0.75" width="898.5" height="288.5" rx="6" fill="none" stroke="#1a1a1a" stroke-opacity="0.55" stroke-width="1.5"/>

  <g font-family="Georgia, 'Times New Roman', Times, serif" fill="#1a1a1a">

    <!-- top strip -->
    <text x="40" y="34" font-size="11" letter-spacing="2.2">VOL. I · NO. 1</text>
    <text x="450" y="34" font-size="11" letter-spacing="2.2" text-anchor="middle">TANGERANG, INDONESIA · EST. 2026</text>
    <text x="860" y="34" font-size="11" letter-spacing="2.2" text-anchor="end">PRICE: ONE INTERVIEW</text>
    <rect x="40" y="42" width="820" height="2.5" fill="#1a1a1a"/>
    <rect x="40" y="47" width="820" height="0.8" fill="#1a1a1a"/>

    <!-- masthead -->
    <text x="450" y="112" font-size="64" font-weight="700" text-anchor="middle" letter-spacing="1" opacity="0">The Safii Gazette
      <animate attributeName="opacity" from="0" to="1" dur="1.1s" begin="0.1s" fill="freeze"/>
    </text>

    <!-- tagline band -->
    <rect x="40" y="126" width="820" height="0.8" fill="#1a1a1a"/>
    <text x="450" y="146" font-size="13" font-style="italic" text-anchor="middle" letter-spacing="0.8">“All the code that’s fit to ship”</text>
    <rect x="40" y="154" width="820" height="0.8" fill="#1a1a1a"/>
    <rect x="40" y="157.5" width="820" height="2.5" fill="#1a1a1a"/>

    <!-- headline -->
    <text x="450" y="212" font-size="30" font-weight="700" text-anchor="middle" textLength="760" lengthAdjust="spacing" opacity="0">DEVELOPER SHIPS, LEARNS, SHIPS AGAIN
      <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.7s" fill="freeze"/>
    </text>
    <text x="450" y="240" font-size="14" font-style="italic" text-anchor="middle" opacity="0">Muhamad Safii, a web developer from Tangerang, treats every project as a chance to get a little better
      <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="1.1s" fill="freeze"/>
    </text>

    <!-- bottom rule -->
    <rect x="40" y="258" width="820" height="0.8" fill="#1a1a1a"/>
    <rect x="40" y="261.5" width="820" height="2.5" fill="#1a1a1a"/>
    <text x="450" y="280" font-size="10" text-anchor="middle" letter-spacing="2" fill-opacity="0.75">LARAVEL  ·  REACT  ·  REST API  ·  MYSQL  ·  FASTAPI  ·  GO (LEARNING)</text>
  </g>

  <!-- stamp -->
  <g transform="rotate(-11 792 100)" opacity="0">
    <animate attributeName="opacity" values="0;0;0.92" keyTimes="0;0.5;1" dur="2.2s" begin="0s" fill="freeze"/>
    <rect x="728" y="76" width="128" height="48" rx="6" fill="none" stroke="#b3261e" stroke-width="3"/>
    <rect x="733" y="81" width="118" height="38" rx="3" fill="none" stroke="#b3261e" stroke-width="1"/>
    <text x="792" y="97" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#b3261e" text-anchor="middle" letter-spacing="2">OPEN TO</text>
    <text x="792" y="113" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="700" fill="#b3261e" text-anchor="middle" letter-spacing="3">WORK</text>
  </g>
</svg>
